<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Corte JJ VR — Perfect VR Experience</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #87ceeb; height: 100%; width: 100%; font-family: 'Segoe UI', sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #startOverlay {
    position: fixed; inset: 0; z-index: 99; background: radial-gradient(circle, #2b4c37 0%, #0f1d14 100%); color: #ffffff;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; text-align: center; padding: 20px;
  }
  #startOverlay h1 { color: #55ff88; font-size: 28px; margin: 0; text-shadow: 0 0 10px rgba(85,255,136,0.5); }
  #vrBtn {
    font-size: 18px; padding: 18px 36px; background: linear-gradient(45deg, #55ff88, #00b34a); color: #07170d; border: none;
    border-radius: 30px; font-weight: bold; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 15px rgba(85,255,136,0.4);
  }
  #hud {
    position: fixed; top: 16px; left: 16px; z-index: 10; background: rgba(0, 0, 0, 0.6);
    color: #55ff88; padding: 10px 18px; border-radius: 20px; font-size: 15px; display: none; font-weight: bold;
    backdrop-filter: blur(4px); border: 1px solid rgba(85,255,136,0.3);
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/effects/StereoEffect.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DeviceOrientationControls.js"></script>
</head>
<body>

<div id="startOverlay">
  <h1>⚔️ CORTE JJ VR</h1>
  <p>1. Conecta tu mando Bluetooth.<br>2. Pon el celular en HORIZONTAL.<br>3. Colócatelo en el VR Box de frente.</p>
  <button id="vrBtn">INICIAR VR</button>
</div>

<div id="hud">👹 Monstruos: <span id="score">0</span> | ❤️ Vida: <span id="hp">100</span></div>

<script>
let camera, scene, renderer, effect, controls;
let isVR = false, score = 0, playerHp = 100;
const enemies = [];
let leftHand, rightHand, weapon, playerBody;
let isAttacking = false, attackTime = 0;
let globalTime = 0;

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x7ec0ee); 
  scene.fog = new THREE.FogExp2(0x9bd0f5, 0.012);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 150);
  camera.position.set(0, 1.6, 0);

  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  document.body.appendChild(renderer.domElement);

  effect = new THREE.StereoEffect(renderer);
  effect.eyeSeparation = 0.04;

  // Controles de Giroscopio Oficiales para VR
  controls = new THREE.DeviceOrientationControls(camera);

  // Iluminación Solar de Alta Calidad
  const sunLight = new THREE.DirectionalLight(0xfffaed, 1.4);
  sunLight.position.set(30, 60, 20);
  sunLight.castShadow = true;
  sunLight.shadow.mapSize.width = 1024;
  sunLight.shadow.mapSize.height = 1024;
  scene.add(sunLight);

  const hemiLight = new THREE.HemisphereLight(0xffffff, 0x3d6e35, 0.7);
  scene.add(hemiLight);

  buildDayWorld();
  createPlayerBody();
  createHandsAndWeapon();

  for(let i = 0; i < 4; i++) spawnDynamicMonster();

  window.addEventListener('touchstart', () => triggerAttack(), {passive: true});
  window.addEventListener('mousedown', () => triggerAttack());
  window.addEventListener('resize', updateLayout);
  window.addEventListener('orientationchange', () => setTimeout(updateLayout, 300));
}

function updateLayout() {
  const width = window.innerWidth;
  const height = window.innerHeight;
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
  renderer.setSize(width, height);
  effect.setSize(width, height);
}

function buildDayWorld() {
  // Pasto Moderno
  const groundGeo = new THREE.PlaneGeometry(250, 250);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x488b37, roughness: 0.8 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // Árboles Estilizados
  for(let i = 0; i < 30; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = 16 + Math.random() * 40;
    createTree(Math.cos(angle)*dist, Math.sin(angle)*dist);
  }

  // Casas Explorables
  createHouse(-12, -16);
  createHouse(12, -18);
  createHouse(0, -32);
}

function createTree(x, z) {
  const group = new THREE.Group();
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.25, 0.35, 3.2, 6),
    new THREE.MeshStandardMaterial({ color: 0x5a3d28, roughness: 0.9 })
  );
  trunk.position.y = 1.6;
  trunk.castShadow = true;

  const leaves = new THREE.Mesh(
    new THREE.ConeGeometry(1.6, 3.2, 5),
    new THREE.MeshStandardMaterial({ color: 0x228b22, roughness: 0.6 })
  );
  leaves.position.y = 4;
  leaves.castShadow = true;

  group.add(trunk, leaves);
  group.position.set(x, 0, z);
  scene.add(group);
}

function createHouse(x, z) {
  const houseGroup = new THREE.Group();
  const wallMat = new THREE.MeshStandardMaterial({ color: 0xe2d4c3, roughness: 0.7 });

  const backWall = new THREE.Mesh(new THREE.BoxGeometry(8, 4, 0.2), wallMat);
  backWall.position.set(0, 2, -4);
  backWall.castShadow = true; backWall.receiveShadow = true;

  const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.2, 4, 8), wallMat);
  leftWall.position.set(-4, 2, 0);
  leftWall.castShadow = true; leftWall.receiveShadow = true;

  const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.2, 4, 8), wallMat);
  rightWall.position.set(4, 2, 0);
  rightWall.castShadow = true; rightWall.receiveShadow = true;

  const frontWallLeft = new THREE.Mesh(new THREE.BoxGeometry(2.8, 4, 0.2), wallMat);
  frontWallLeft.position.set(-2.6, 2, 4);

  const frontWallRight = new THREE.Mesh(new THREE.BoxGeometry(2.8, 4, 0.2), wallMat);
  frontWallRight.position.set(2.6, 2, 4);

  const frontWallTop = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1.2, 0.2), wallMat);
  frontWallTop.position.set(0, 3.4, 4);

  const roof = new THREE.Mesh(
    new THREE.ConeGeometry(6.5, 3, 4),
    new THREE.MeshStandardMaterial({ color: 0xb23b2a, roughness: 0.5 })
  );
  roof.position.set(0, 5.5, 0);
  roof.rotation.y = Math.PI / 4;
  roof.castShadow = true;

  const floorInside = new THREE.Mesh(
    new THREE.PlaneGeometry(7.8, 7.8),
    new THREE.MeshStandardMaterial({ color: 0x5c3a21 })
  );
  floorInside.rotation.x = -Math.PI / 2;
  floorInside.position.y = 0.02;

  houseGroup.add(backWall, leftWall, rightWall, frontWallLeft, frontWallRight, frontWallTop, roof, floorInside);
  houseGroup.position.set(x, 0, z);
  scene.add(houseGroup);
}

function createPlayerBody() {
  playerBody = new THREE.Group();

  const torsoMat = new THREE.MeshStandardMaterial({ color: 0x1f3a60, roughness: 0.4 });
  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.65, 0.25), torsoMat);
  torso.position.set(0, -0.65, -0.1);

  const legMat = new THREE.MeshStandardMaterial({ color: 0x111b28 });
  const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.7, 0.18), legMat);
  leftLeg.position.set(-0.15, -1.25, -0.1);

  const rightLeg = leftLeg.clone();
  rightLeg.position.x = 0.15;

  playerBody.add(torso, leftLeg, rightLeg);
  camera.add(playerBody);
}

function createHandsAndWeapon() {
  const handMat = new THREE.MeshStandardMaterial({ color: 0xe5b887, roughness: 0.5 });

  leftHand = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 0.22), handMat);
  leftHand.position.set(-0.25, -0.25, -0.45);

  rightHand = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 0.22), handMat);
  rightHand.position.set(0.25, -0.25, -0.45);

  const bladeMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.9, roughness: 0.1 });
  weapon = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.7, 0.03), bladeMat);
  weapon.position.set(0, 0.25, -0.05);
  weapon.rotation.x = -Math.PI / 5;
  rightHand.add(weapon);

  camera.add(leftHand);
  camera.add(rightHand);
  scene.add(camera);
}

function spawnDynamicMonster() {
  const monsterGroup = new THREE.Group();

  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xd62828, roughness: 0.3 });
  const body = new THREE.Mesh(new THREE.DodecahedronGeometry(0.6), bodyMat);
  body.position.y = 1.0;
  body.castShadow = true;

  const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffea00 });
  const eye1 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.1), eyeMat);
  eye1.position.set(-0.2, 1.2, -0.35);
  const eye2 = eye1.clone();
  eye2.position.x = 0.2;

  monsterGroup.add(body, eye1, eye2);

  const angle = Math.random() * Math.PI * 2;
  const dist = 14 + Math.random() * 12;
  monsterGroup.position.set(Math.cos(angle)*dist, 0, Math.sin(angle)*dist);
  monsterGroup.userData = { hp: 3, baseZ: Math.random() * 100, meshBody: bodyMat };

  scene.add(monsterGroup);
  enemies.push(monsterGroup);
}

document.getElementById('vrBtn').addEventListener('click', () => {
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(() => startVR()).catch(() => startVR());
  } else {
    startVR();
  }
});

function startVR() {
  isVR = true;
  document.getElementById('startOverlay').style.display = 'none';
  document.getElementById('hud').style.display = 'block';

  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen().catch(()=>{});

  setTimeout(() => updateLayout(), 400);
  animate();
}

function triggerAttack() {
  if (!isAttacking) {
    isAttacking = true;
    attackTime = 0;
  }
}

// Control Manual por Palanca Bluetooth
function updateGamepadInput() {
  const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (let gp of gamepads) {
    if (!gp) continue;

    const moveX = gp.axes[0] || 0;
    const moveZ = gp.axes[1] || 0;

    // Solo se moverá cuando accciones el joystick
    if (Math.abs(moveX) > 0.2 || Math.abs(moveZ) > 0.2) {
      const moveDir = new THREE.Vector3(moveX, 0, moveZ);
      moveDir.applyQuaternion(camera.quaternion);
      moveDir.y = 0;
      moveDir.normalize();
      camera.position.addScaledVector(moveDir, 0.08);
    }

    if (gp.buttons.some(b => b.pressed)) {
      triggerAttack();
    }
  }
}

const raycaster = new THREE.Raycaster();
const dir = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);
  if (!isVR) return;

  globalTime += 0.05;

  // Actualiza rotación con DeviceOrientationControls
  controls.update();

  updateGamepadInput();

  if (isAttacking) {
    attackTime += 0.25;
    rightHand.position.z = -0.45 - Math.sin(attackTime) * 0.25;
    rightHand.rotation.x = -Math.sin(attackTime) * 0.6;
    if (attackTime >= Math.PI) {
      isAttacking = false;
      rightHand.position.set(0.25, -0.25, -0.45);
      rightHand.rotation.set(0, 0, 0);
    }
  }

  raycaster.set(camera.position, camera.getWorldDirection(dir));

  enemies.forEach((enemy, index) => {
    const ePos = enemy.position;
    const distance = ePos.distanceTo(camera.position);

    ePos.y = Math.sin(globalTime + enemy.userData.baseZ) * 0.2 + 0.2;

    if (distance > 1.3) {
      const moveDir = new THREE.Vector3().subVectors(camera.position, ePos).normalize();
      ePos.x += moveDir.x * 0.022;
      ePos.z += moveDir.z * 0.022;
      enemy.lookAt(camera.position.x, enemy.position.y, camera.position.z);
    } else {
      playerHp -= 0.15;
      document.getElementById('hp').textContent = Math.max(0, Math.floor(playerHp));
    }

    const hitEnemies = raycaster.intersectObjects(enemy.children);
    if (hitEnemies.length > 0 && isAttacking) {
      enemy.userData.hp -= 1;
      enemy.userData.meshBody.color.setHex(0xffffff);
      setTimeout(() => enemy.userData.meshBody.color.setHex(0xd62828), 100);

      enemy.position.x += dir.x * 0.6;
      enemy.position.z += dir.z * 0.6;

      if (enemy.userData.hp <= 0) {
        scene.remove(enemy);
        enemies.splice(index, 1);
        score++;
        document.getElementById('score').textContent = score;
        spawnDynamicMonster();
      }
    }
  });

  effect.render(scene, camera);
}

init();
</script>
</body>
</html>
