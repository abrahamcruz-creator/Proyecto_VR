<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Corte JJ VR — Corrección Horizontal</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; height: 100%; font-family: sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #startOverlay {
    position: fixed; inset: 0; z-index: 99; background: #051408; color: #eafff0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 20px;
  }
  #startOverlay h1 { color: #00ff44; font-size: 24px; margin: 0; }
  #vrBtn {
    font-size: 18px; padding: 16px 32px; background: #00ff44; color: #051408; border: none;
    border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase;
  }
  #hud {
    position: fixed; top: 12px; left: 12px; z-index: 10; background: rgba(0,0,0,0.7);
    color: #00ff44; padding: 8px 14px; border-radius: 6px; font-size: 14px; display: none; font-weight: bold;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/effects/StereoEffect.js"></script>
</head>
<body>

<div id="startOverlay">
  <h1>⛏ CORTE JJ — VR BOX</h1>
  <p>Toca el botón y coloca el celular en horizontal.</p>
  <button id="vrBtn">ENTRAR AL MUNDO VR</button>
</div>

<div id="hud">💎 Esmeraldas: <span id="gems">0</span> | ❤️ Vida: <span id="hp">100</span></div>

<script>
let camera, scene, renderer, effect;
let isVR = false, emeralds = 0, playerHp = 100;
const gemRocks = [], enemies = [];
let actionHeld = false;
let pickaxeGroup;

// Manejo preciso de orientacion para Celulares
let deviceOrientation = {};
let screenOrientation = 0;

window.addEventListener('deviceorientation', (e) => {
  deviceOrientation = e;
}, true);

window.addEventListener('orientationchange', () => {
  screenOrientation = window.orientation || 0;
  setTimeout(onWindowResize, 200);
});

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x7ec0ee);
  scene.fog = new THREE.FogExp2(0x7ec0ee, 0.01);

  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 150);
  camera.position.set(0, 1.6, 5);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);

  effect = new THREE.StereoEffect(renderer);
  effect.eyeSeparation = 0.035; // Distancia corregida para VR Box
  effect.setSize(window.innerWidth, window.innerHeight);

  // Luces
  const light = new THREE.HemisphereLight(0xffffff, 0x335522, 1.2);
  scene.add(light);
  const sun = new THREE.DirectionalLight(0xfffaed, 0.9);
  sun.position.set(20, 40, 20);
  scene.add(sun);

  buildEnvironment();
  createPickaxe();

  // Spawns
  for(let i=0; i<12; i++) {
    const r = 8 + Math.random()*20;
    const a = Math.random()*Math.PI*2;
    spawnRock(Math.cos(a)*r, Math.sin(a)*r);
  }

  for(let i=0; i<3; i++) {
    const r = 12 + Math.random()*15;
    const a = Math.random()*Math.PI*2;
    spawnEnemy(Math.cos(a)*r, Math.sin(a)*r);
  }

  window.addEventListener('touchstart', () => actionHeld = true, {passive: true});
  window.addEventListener('touchend', () => actionHeld = false, {passive: true});
  window.addEventListener('mousedown', () => actionHeld = true);
  window.addEventListener('mouseup', () => actionHeld = false);
  window.addEventListener('resize', onWindowResize);
}

function buildEnvironment() {
  // Suelo
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(160, 160),
    new THREE.MeshLambertMaterial({ color: 0x4e8b28 })
  );
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  // Montañas
  for(let i=0; i<16; i++) {
    const ang = (i / 16) * Math.PI * 2;
    const dist = 60 + Math.random()*10;
    const m = new THREE.Mesh(
      new THREE.ConeGeometry(10 + Math.random()*5, 20 + Math.random()*10, 5),
      new THREE.MeshLambertMaterial({ color: 0x2e5016 })
    );
    m.position.set(Math.cos(ang)*dist, 8, Math.sin(ang)*dist);
    scene.add(m);
  }

  // Bosque
  for(let i=0; i<35; i++) {
    const r = 6 + Math.random()*35;
    const a = Math.random()*Math.PI*2;
    createTree(Math.cos(a)*r, Math.sin(a)*r);
  }
}

function createTree(x, z) {
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 3), new THREE.MeshLambertMaterial({color: 0x5a3d28}));
  trunk.position.set(x, 1.5, z);
  scene.add(trunk);

  const leaves = new THREE.Mesh(new THREE.DodecahedronGeometry(1.6), new THREE.MeshLambertMaterial({color: 0x1e6019}));
  leaves.position.set(x, 3.5, z);
  scene.add(leaves);
}

function createPickaxe() {
  pickaxeGroup = new THREE.Group();

  const handle = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.5, 0.04), new THREE.MeshLambertMaterial({color: 0x5a3d28}));
  handle.position.set(0.3, -0.25, -0.5);
  handle.rotation.x = Math.PI / 4;

  const head = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.05, 0.07), new THREE.MeshLambertMaterial({color: 0xcccccc}));
  head.position.set(0.3, -0.1, -0.65);

  pickaxeGroup.add(handle, head);
  camera.add(pickaxeGroup);
  scene.add(camera);
}

function spawnRock(x, z) {
  const rock = new THREE.Mesh(
    new THREE.DodecahedronGeometry(0.5),
    new THREE.MeshLambertMaterial({ color: 0x00ff55 })
  );
  rock.position.set(x, 0.4, z);
  rock.userData = { hp: 0 };
  scene.add(rock);
  gemRocks.push(rock);
}

function spawnEnemy(x, z) {
  const enemyGroup = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.5, 0.7), new THREE.MeshLambertMaterial({color: 0x881111}));
  body.position.y = 0.75;

  const eye1 = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 0.1), new THREE.MeshBasicMaterial({color: 0xffff00}));
  eye1.position.set(-0.15, 1.1, -0.36);
  const eye2 = eye1.clone();
  eye2.position.x = 0.15;

  enemyGroup.add(body, eye1, eye2);
  enemyGroup.position.set(x, 0, z);
  enemyGroup.userData = { hp: 3 };

  scene.add(enemyGroup);
  enemies.push(enemyGroup);
}

function onWindowResize() {
  const width = window.innerWidth;
  const height = window.innerHeight;
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
  renderer.setSize(width, height);
  effect.setSize(width, height);
}

document.getElementById('vrBtn').addEventListener('click', () => {
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(() => startVR()).catch(() => startVR());
  } else {
    startVR();
  }
});

function startVR() {
  isVR = true;
  document.getElementById('startOverlay').style.display = 'none';
  document.getElementById('hud').style.display = 'block';
  
  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen().catch(()=>{});

  onWindowResize();
  animate();
}

// LÓGICA DE ROTACIÓN CUÁNTICA PARA EVITAR DISTORSIÓN HORIZONTAL
const updateCameraRotation = (function() {
  const zee = new THREE.Vector3(0, 0, 1);
  const euler = new THREE.Euler();
  const q0 = new THREE.Quaternion();
  const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));

  return function() {
    if (!deviceOrientation || deviceOrientation.alpha === null) return;

    const alpha = deviceOrientation.alpha ? THREE.MathUtils.degToRad(deviceOrientation.alpha) : 0;
    const beta = deviceOrientation.beta ? THREE.MathUtils.degToRad(deviceOrientation.beta) : 0;
    const gamma = deviceOrientation.gamma ? THREE.MathUtils.degToRad(deviceOrientation.gamma) : 0;
    const orient = screenOrientation ? THREE.MathUtils.degToRad(screenOrientation) : 0;

    euler.set(beta, alpha, -gamma, 'YXZ');
    camera.quaternion.setFromEuler(euler);
    camera.quaternion.multiply(q1);
    camera.quaternion.multiply(q0.setFromAxisAngle(zee, -orient));
  };
})();

const raycaster = new THREE.Raycaster();
const dir = new THREE.Vector3();
let swingAngle = 0;

function animate() {
  requestAnimationFrame(animate);
  if (!isVR) return;

  // Actualizar rotación real según la inclinación
  updateCameraRotation();

  // Movimiento al presionar
  if (actionHeld) {
    camera.getWorldDirection(dir);
    dir.y = 0;
    dir.normalize();
    camera.position.addScaledVector(dir, 0.05);

    swingAngle += 0.2;
    pickaxeGroup.rotation.x = Math.sin(swingAngle) * 0.3;
  } else {
    pickaxeGroup.rotation.set(0,0,0);
  }

  raycaster.set(camera.position, camera.getWorldDirection(dir));

  // Minar
  const hitGems = raycaster.intersectObjects(gemRocks);
  if (hitGems.length > 0 && actionHeld) {
    const target = hitGems[0].object;
    target.userData.hp += 0.04;
    target.scale.setScalar(1 - target.userData.hp * 0.3);
    if (target.userData.hp >= 1) {
      scene.remove(target);
      gemRocks.splice(gemRocks.indexOf(target), 1);
      emeralds++;
      document.getElementById('gems').textContent = emeralds;
    }
  }

  // Enemigos
  enemies.forEach((enemy, index) => {
    const ePos = enemy.position;
    const distance = ePos.distanceTo(camera.position);

    if (distance > 1.4) {
      const moveDir = new THREE.Vector3().subVectors(camera.position, ePos).normalize();
      ePos.x += moveDir.x * 0.018;
      ePos.z += moveDir.z * 0.018;
      enemy.lookAt(camera.position.x, enemy.position.y, camera.position.z);
    } else {
      playerHp -= 0.1;
      document.getElementById('hp').textContent = Math.max(0, Math.floor(playerHp));
    }

    const hitEnemies = raycaster.intersectObjects(enemy.children);
    if (hitEnemies.length > 0 && actionHeld) {
      enemy.userData.hp -= 0.06;
      enemy.position.x -= dir.x * 0.2;
      enemy.position.z -= dir.z * 0.2;
      if (enemy.userData.hp <= 0) {
        scene.remove(enemy);
        enemies.splice(index, 1);
      }
    }
  });

  effect.render(scene, camera);
}

init();
</script>
</body>
</html>
