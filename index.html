<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Corte JJ VR — Immersive Combat</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; height: 100%; width: 100%; font-family: sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #startOverlay {
    position: fixed; inset: 0; z-index: 99; background: #051408; color: #eafff0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 20px;
  }
  #startOverlay h1 { color: #00ff44; font-size: 24px; margin: 0; }
  #vrBtn {
    font-size: 18px; padding: 16px 32px; background: #00ff44; color: #051408; border: none;
    border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase;
  }
  #hud {
    position: fixed; top: 12px; left: 12px; z-index: 10; background: rgba(0,0,0,0.7);
    color: #00ff44; padding: 8px 14px; border-radius: 6px; font-size: 14px; display: none; font-weight: bold;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/effects/StereoEffect.js"></script>
</head>
<body>

<div id="startOverlay">
  <h1>⛏ CORTE JJ — VR BOX COMBAT</h1>
  <p>1. Conecta tu control Bluetooth al celular.<br>2. Pon el celular en HORIZONTAL.<br>3. Presiona INICIAR VR.</p>
  <button id="vrBtn">INICIAR VR</button>
</div>

<div id="hud">👹 Monstruos Derrotados: <span id="score">0</span> | ❤️ Vida: <span id="hp">100</span></div>

<script>
let camera, scene, renderer, effect;
let isVR = false, score = 0, playerHp = 100;
const enemies = [];
let leftHand, rightHand, weapon;
let isAttacking = false, attackTime = 0;

// Giroscopio Celular
let alpha = 0, beta = 0, gamma = 0, hasGyro = false;

window.addEventListener('deviceorientation', (e) => {
  if (e.alpha !== null) {
    hasGyro = true;
    alpha = e.alpha;
    beta = e.beta;
    gamma = e.gamma;
  }
}, true);

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111c24);
  scene.fog = new THREE.FogExp2(0x111c24, 0.015);

  camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 150);
  camera.position.set(0, 1.6, 5);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);

  effect = new THREE.StereoEffect(renderer);
  effect.eyeSeparation = 0.05;

  // Iluminación
  const light = new THREE.HemisphereLight(0xffffff, 0x223344, 1.2);
  scene.add(light);
  const redSun = new THREE.DirectionalLight(0xff4422, 1);
  redSun.position.set(20, 40, 20);
  scene.add(redSun);

  buildEnvironment();
  createHandsAndWeapon();

  // Generar monstruos iniciales
  for(let i = 0; i < 5; i++) {
    spawnMonster();
  }

  window.addEventListener('touchstart', () => triggerAttack(), {passive: true});
  window.addEventListener('mousedown', () => triggerAttack());
  window.addEventListener('resize', updateLayout);
  window.addEventListener('orientationchange', () => setTimeout(updateLayout, 300));
}

function updateLayout() {
  const width = window.innerWidth;
  const height = window.innerHeight;
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
  renderer.setSize(width, height);
  effect.setSize(width, height);
}

function buildEnvironment() {
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(160, 160),
    new THREE.MeshLambertMaterial({ color: 0x1e2e1c })
  );
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  // Rocas oscuras alrededor
  for(let i=0; i<20; i++) {
    const ang = (i / 20) * Math.PI * 2;
    const dist = 40 + Math.random()*15;
    const m = new THREE.Mesh(
      new THREE.DodecahedronGeometry(3 + Math.random()*3),
      new THREE.MeshLambertMaterial({ color: 0x333344 })
    );
    m.position.set(Math.cos(ang)*dist, 1.5, Math.sin(ang)*dist);
    scene.add(m);
  }
}

function createHandsAndWeapon() {
  const handMat = new THREE.MeshLambertMaterial({ color: 0xdb9b7b });

  // Mano Izquierda
  leftHand = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.2), handMat);
  leftHand.position.set(-0.25, -0.25, -0.45);

  // Mano Derecha
  rightHand = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.2), handMat);
  rightHand.position.set(0.25, -0.25, -0.45);

  // Espada en mano derecha
  const bladeMat = new THREE.MeshLambertMaterial({ color: 0x00ffcc, emissive: 0x004433 });
  weapon = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.6, 0.04), bladeMat);
  weapon.position.set(0, 0.2, -0.05);
  weapon.rotation.x = -Math.PI / 6;
  rightHand.add(weapon);

  camera.add(leftHand);
  camera.add(rightHand);
  scene.add(camera);
}

function spawnMonster() {
  const monsterGroup = new THREE.Group();

  // Cuerpo del Monstruo
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(0.9, 1.8, 0.9),
    new THREE.MeshLambertMaterial({ color: 0x771111 })
  );
  body.position.y = 0.9;

  // Ojos Brillantes
  const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffea00 });
  const eye1 = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 0.1), eyeMat);
  eye1.position.set(-0.2, 1.4, -0.46);
  const eye2 = eye1.clone();
  eye2.position.x = 0.2;

  // Cuernos
  const hornMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
  const horn1 = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.4, 4), hornMat);
  horn1.position.set(-0.3, 1.9, 0);
  const horn2 = horn1.clone();
  horn2.position.x = 0.3;

  monsterGroup.add(body, eye1, eye2, horn1, horn2);

  const angle = Math.random() * Math.PI * 2;
  const dist = 15 + Math.random() * 15;
  monsterGroup.position.set(Math.cos(angle)*dist, 0, Math.sin(angle)*dist);
  monsterGroup.userData = { hp: 3 };

  scene.add(monsterGroup);
  enemies.push(monsterGroup);
}

document.getElementById('vrBtn').addEventListener('click', () => {
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(() => startVR()).catch(() => startVR());
  } else {
    startVR();
  }
});

function startVR() {
  isVR = true;
  document.getElementById('startOverlay').style.display = 'none';
  document.getElementById('hud').style.display = 'block';

  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen().catch(()=>{});

  setTimeout(() => updateLayout(), 500);
  animate();
}

function triggerAttack() {
  if (!isAttacking) {
    isAttacking = true;
    attackTime = 0;
  }
}

// Lógica de Movimiento por Control Bluetooth (Gamepad API)
function updateGamepadInput() {
  const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (let gp of gamepads) {
    if (!gp) continue;

    // Palanca izquierda (Ejes 0 y 1)
    const moveX = gp.axes[0] || 0;
    const moveZ = gp.axes[1] || 0;

    if (Math.abs(moveX) > 0.15 || Math.abs(moveZ) > 0.15) {
      const moveDir = new THREE.Vector3(moveX, 0, moveZ);
      moveDir.applyQuaternion(camera.quaternion);
      moveDir.y = 0;
      moveDir.normalize();
      camera.position.addScaledVector(moveDir, 0.07);
    }

    // Botones A, B, X, Y o Gatillos (Botón 0, 1, 2, 3...)
    if (gp.buttons.some(b => b.pressed)) {
      triggerAttack();
    }
  }
}

function updateCameraOrientation() {
  if (!hasGyro) return;
  const radX = THREE.MathUtils.degToRad(gamma); 
  const radY = THREE.MathUtils.degToRad(alpha); 
  const radZ = THREE.MathUtils.degToRad(-beta);
  camera.rotation.set(radX, radY, radZ, 'YXZ');
}

const raycaster = new THREE.Raycaster();
const dir = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);
  if (!isVR) return;

  updateCameraOrientation();
  updateGamepadInput();

  // Animación de ataque de manos
  if (isAttacking) {
    attackTime += 0.25;
    rightHand.position.z = -0.45 - Math.sin(attackTime) * 0.25;
    rightHand.rotation.x = -Math.sin(attackTime) * 0.5;
    if (attackTime >= Math.PI) {
      isAttacking = false;
      rightHand.position.set(0.25, -0.25, -0.45);
      rightHand.rotation.set(0, 0, 0);
    }
  }

  // Comportamiento de Enemigos y Detección de Daño
  raycaster.set(camera.position, camera.getWorldDirection(dir));

  enemies.forEach((enemy, index) => {
    const ePos = enemy.position;
    const distance = ePos.distanceTo(camera.position);

    // Avanzar hacia el jugador
    if (distance > 1.3) {
      const moveDir = new THREE.Vector3().subVectors(camera.position, ePos).normalize();
      ePos.x += moveDir.x * 0.025;
      ePos.z += moveDir.z * 0.025;
      enemy.lookAt(camera.position.x, enemy.position.y, camera.position.z);
    } else {
      // Hacer daño al jugador cuando esté cerca
      playerHp -= 0.15;
      document.getElementById('hp').textContent = Math.max(0, Math.floor(playerHp));
    }

    // Atacar al monstruo si lo miras y presionas el botón/pantalla
    const hitEnemies = raycaster.intersectObjects(enemy.children);
    if (hitEnemies.length > 0 && isAttacking) {
      enemy.userData.hp -= 1;
      enemy.position.x += dir.x * 0.5; // Empujón
      enemy.position.z += dir.z * 0.5;

      if (enemy.userData.hp <= 0) {
        scene.remove(enemy);
        enemies.splice(index, 1);
        score++;
        document.getElementById('score').textContent = score;
        spawnMonster(); // Reaparición de monstruos
      }
    }
  });

  effect.render(scene, camera);
}

init();
</script>
</body>
</html>
