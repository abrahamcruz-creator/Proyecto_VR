<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Corte JJ VR — Ultra Edition</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; height: 100%; width: 100%; font-family: 'Segoe UI', sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #startOverlay {
    position: fixed; inset: 0; z-index: 99; background: radial-gradient(circle, #1a2e22 0%, #050b07 100%); color: #ffffff;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; text-align: center; padding: 20px;
  }
  #startOverlay h1 { color: #55ff88; font-size: 32px; margin: 0; text-shadow: 0 0 15px rgba(85,255,136,0.6); }
  #vrBtn {
    font-size: 18px; padding: 18px 36px; background: linear-gradient(45deg, #55ff88, #00b34a); color: #07170d; border: none;
    border-radius: 30px; font-weight: bold; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 20px rgba(85,255,136,0.5);
  }
  #hud {
    position: fixed; top: 16px; left: 16px; z-index: 10; background: rgba(0, 0, 0, 0.7);
    color: #55ff88; padding: 10px 18px; border-radius: 20px; font-size: 15px; display: none; font-weight: bold;
    backdrop-filter: blur(5px); border: 1px solid rgba(85,255,136,0.4);
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/effects/StereoEffect.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DeviceOrientationControls.js"></script>
</head>
<body>

<div id="startOverlay">
  <h1>⚔️ CORTE JJ VR (ULTRA)</h1>
  <p>1. Conecta tu mando Bluetooth o toca la pantalla.<br>2. Pon el celular en HORIZONTAL.<br>3. Colócatelo en el VR Box.</p>
  <button id="vrBtn">INICIAR VR</button>
</div>

<div id="hud">👹 Monstruos: <span id="score">0</span> | ❤️ Vida: <span id="hp">100</span></div>

<script>
let camera, scene, renderer, effect, controls;
let isVR = false, score = 0, playerHp = 100;
const enemies = [];
let leftHand, rightHand, weapon, playerBody;
let isAttacking = false, attackTime = 0;
let globalTime = 0;
let autoMoveForward = false;

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x5c94cd); 
  scene.fog = new THREE.FogExp2(0x81abdc, 0.008);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
  camera.position.set(0, 1.7, 0);

  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  document.body.appendChild(renderer.domElement);

  effect = new THREE.StereoEffect(renderer);
  effect.eyeSeparation = 0.04;

  controls = new THREE.DeviceOrientationControls(camera);

  // Iluminación Avanzada
  const sunLight = new THREE.DirectionalLight(0xfff2d1, 1.6);
  sunLight.position.set(40, 70, 30);
  sunLight.castShadow = true;
  sunLight.shadow.mapSize.width = 2048;
  sunLight.shadow.mapSize.height = 2048;
  scene.add(sunLight);

  const ambientLight = new THREE.AmbientLight(0x76a3d9, 0.5);
  scene.add(ambientLight);

  const hemiLight = new THREE.HemisphereLight(0xddeeff, 0x3b6329, 0.6);
  scene.add(hemiLight);

  buildModernWorld();
  createPlayerBodyModern();
  createHandsAndWeaponModern();

  for(let i = 0; i < 5; i++) spawnDynamicMonster();

  // Controles Táctiles (Tocar pantalla para avanzar/atacar)
  window.addEventListener('touchstart', (e) => {
    triggerAttack();
    autoMoveForward = true;
  }, {passive: true});
  
  window.addEventListener('touchend', () => {
    autoMoveForward = false;
  });

  window.addEventListener('mousedown', () => triggerAttack());
  window.addEventListener('resize', updateLayout);
  window.addEventListener('orientationchange', () => setTimeout(updateLayout, 300));
}

function updateLayout() {
  const width = window.innerWidth;
  const height = window.innerHeight;
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
  renderer.setSize(width, height);
  effect.setSize(width, height);
}

function buildModernWorld() {
  // Terreno
  const groundGeo = new THREE.PlaneGeometry(300, 300);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x3b702a, roughness: 0.9 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // Montañas lejanas
  for(let i = 0; i < 12; i++) {
    const angle = (i / 12) * Math.PI * 2;
    const mountain = new THREE.Mesh(
      new THREE.ConeGeometry(30 + Math.random() * 20, 50 + Math.random() * 20, 5),
      new THREE.MeshStandardMaterial({ color: 0x2b455c, roughness: 0.9 })
    );
    mountain.position.set(Math.cos(angle) * 120, 20, Math.sin(angle) * 120);
    scene.add(mountain);
  }

  // Rocas y Vegetación
  for(let i = 0; i < 40; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = 12 + Math.random() * 50;
    createTree(Math.cos(angle)*dist, Math.sin(angle)*dist);
    if(i % 2 === 0) createRock(Math.cos(angle)*(dist+4), Math.sin(angle)*(dist+4));
  }

  createHouse(-15, -20);
  createHouse(15, -22);
  createHouse(0, -40);
}

function createTree(x, z) {
  const group = new THREE.Group();
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.3, 0.45, 3.5, 7),
    new THREE.MeshStandardMaterial({ color: 0x4a2f1b, roughness: 0.8 })
  );
  trunk.position.y = 1.75;
  trunk.castShadow = true;

  const leaves = new THREE.Mesh(
    new THREE.DodecahedronGeometry(2),
    new THREE.MeshStandardMaterial({ color: 0x1e7b23, roughness: 0.5 })
  );
  leaves.position.y = 4.2;
  leaves.castShadow = true;

  group.add(trunk, leaves);
  group.position.set(x, 0, z);
  scene.add(group);
}

function createRock(x, z) {
  const rock = new THREE.Mesh(
    new THREE.DodecahedronGeometry(0.7 + Math.random() * 0.8),
    new THREE.MeshStandardMaterial({ color: 0x6a757e, roughness: 0.7 })
  );
  rock.position.set(x, 0.4, z);
  rock.rotation.set(Math.random(), Math.random(), Math.random());
  rock.castShadow = true;
  scene.add(rock);
}

function createHouse(x, z) {
  const houseGroup = new THREE.Group();
  const wallMat = new THREE.MeshStandardMaterial({ color: 0xdfd4c5, roughness: 0.6 });

  const main = new THREE.Mesh(new THREE.BoxGeometry(9, 4.5, 9), wallMat);
  main.position.set(0, 2.25, 0);
  main.castShadow = true; main.receiveShadow = true;

  const roof = new THREE.Mesh(
    new THREE.ConeGeometry(7.5, 3.5, 4),
    new THREE.MeshStandardMaterial({ color: 0x9e2a2b, roughness: 0.4 })
  );
  roof.position.set(0, 6, 0);
  roof.rotation.y = Math.PI / 4;
  roof.castShadow = true;

  houseGroup.add(main, roof);
  houseGroup.position.set(x, 0, z);
  scene.add(houseGroup);
}

// Personaje Futurista / Moderno
function createPlayerBodyModern() {
  playerBody = new THREE.Group();

  const armorMat = new THREE.MeshStandardMaterial({ color: 0x112233, metalness: 0.8, roughness: 0.2 });
  const glowMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });

  // Torso metálico
  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.7, 0.3), armorMat);
  torso.position.set(0, -0.65, -0.1);

  // Núcleo brillante en el pecho
  const core = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.32, 8), glowMat);
  core.rotation.x = Math.PI / 2;
  core.position.set(0, -0.55, -0.05);

  // Hombreras modernas
  const shoulderLeft = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.25), armorMat);
  shoulderLeft.position.set(-0.32, -0.4, -0.1);

  const shoulderRight = shoulderLeft.clone();
  shoulderRight.position.x = 0.32;

  playerBody.add(torso, core, shoulderLeft, shoulderRight);
  camera.add(playerBody);
}

function createHandsAndWeaponModern() {
  const gloveMat = new THREE.MeshStandardMaterial({ color: 0x1b2631, metalness: 0.5, roughness: 0.3 });

  leftHand = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 0.22), gloveMat);
  leftHand.position.set(-0.28, -0.25, -0.45);

  rightHand = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 0.22), gloveMat);
  rightHand.position.set(0.28, -0.25, -0.45);

  // Espada tipo Plasma
  const hiltMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, metalness: 0.9 });
  const hilt = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.25), hiltMat);
  hilt.position.set(0, 0, 0);

  const bladeMat = new THREE.MeshBasicMaterial({ color: 0x55ff88 });
  weapon = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.85, 0.02), bladeMat);
  weapon.position.set(0, 0.45, 0);

  const weaponGroup = new THREE.Group();
  weaponGroup.add(hilt, weapon);
  weaponGroup.position.set(0, 0.15, -0.05);
  weaponGroup.rotation.x = -Math.PI / 4;

  rightHand.add(weaponGroup);

  camera.add(leftHand);
  camera.add(rightHand);
  scene.add(camera);
}

function spawnDynamicMonster() {
  const monsterGroup = new THREE.Group();

  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xb71c1c, roughness: 0.3, metalness: 0.2 });
  const body = new THREE.Mesh(new THREE.DodecahedronGeometry(0.65), bodyMat);
  body.position.y = 1.0;
  body.castShadow = true;

  const eyeMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
  const eye1 = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 0.12), eyeMat);
  eye1.position.set(-0.2, 1.25, -0.38);
  const eye2 = eye1.clone();
  eye2.position.x = 0.2;

  monsterGroup.add(body, eye1, eye2);

  const angle = Math.random() * Math.PI * 2;
  const dist = 16 + Math.random() * 15;
  monsterGroup.position.set(Math.cos(angle)*dist, 0, Math.sin(angle)*dist);
  monsterGroup.userData = { hp: 3, baseZ: Math.random() * 100, meshBody: bodyMat };

  scene.add(monsterGroup);
  enemies.push(monsterGroup);
}

document.getElementById('vrBtn').addEventListener('click', () => {
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(() => startVR()).catch(() => startVR());
  } else {
    startVR();
  }
});

function startVR() {
  isVR = true;
  document.getElementById('startOverlay').style.display = 'none';
  document.getElementById('hud').style.display = 'block';

  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen().catch(()=>{});

  setTimeout(() => updateLayout(), 400);
  animate();
}

function triggerAttack() {
  if (!isAttacking) {
    isAttacking = true;
    attackTime = 0;
  }
}

// Control por Mando Bluetooth + Avance Táctil
function updatePlayerMovement() {
  const moveDir = new THREE.Vector3();

  // 1. Movimiento vía Gamepad (Joystick)
  const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
  let movedWithGamepad = false;

  for (let gp of gamepads) {
    if (!gp) continue;
    const moveX = gp.axes[0] || 0;
    const moveZ = gp.axes[1] || 0;

    if (Math.abs(moveX) > 0.15 || Math.abs(moveZ) > 0.15) {
      moveDir.set(moveX, 0, moveZ);
      movedWithGamepad = true;
    }

    if (gp.buttons.some(b => b.pressed)) {
      triggerAttack();
    }
  }

  // 2. Movimiento Táctil (Si no usas mando, avanza hacia donde miras al tocar la pantalla)
  if (!movedWithGamepad && autoMoveForward) {
    camera.getWorldDirection(moveDir);
    moveDir.y = 0;
  }

  if (moveDir.lengthSq() > 0) {
    moveDir.applyQuaternion(camera.quaternion);
    moveDir.y = 0;
    moveDir.normalize();
    camera.position.addScaledVector(moveDir, 0.09);
  }
}

const raycaster = new THREE.Raycaster();
const dir = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);
  if (!isVR) return;

  globalTime += 0.05;

  controls.update();
  updatePlayerMovement();

  if (isAttacking) {
    attackTime += 0.25;
    rightHand.position.z = -0.45 - Math.sin(attackTime) * 0.3;
    rightHand.rotation.x = -Math.sin(attackTime) * 0.8;
    if (attackTime >= Math.PI) {
      isAttacking = false;
      rightHand.position.set(0.28, -0.25, -0.45);
      rightHand.rotation.set(0, 0, 0);
    }
  }

  raycaster.set(camera.position, camera.getWorldDirection(dir));

  enemies.forEach((enemy, index) => {
    const ePos = enemy.position;
    const distance = ePos.distanceTo(camera.position);

    ePos.y = Math.sin(globalTime + enemy.userData.baseZ) * 0.2 + 0.2;

    if (distance > 1.3) {
      const moveDir = new THREE.Vector3().subVectors(camera.position, ePos).normalize();
      ePos.x += moveDir.x * 0.025;
      ePos.z += moveDir.z * 0.025;
      enemy.lookAt(camera.position.x, enemy.position.y, camera.position.z);
    } else {
      playerHp -= 0.15;
      document.getElementById('hp').textContent = Math.max(0, Math.floor(playerHp));
    }

    const hitEnemies = raycaster.intersectObjects(enemy.children);
    if (hitEnemies.length > 0 && isAttacking) {
      enemy.userData.hp -= 1;
      enemy.userData.meshBody.color.setHex(0xffffff);
      setTimeout(() => enemy.userData.meshBody.color.setHex(0xb71c1c), 100);

      enemy.position.x += dir.x * 0.7;
      enemy.position.z += dir.z * 0.7;

      if (enemy.userData.hp <= 0) {
        scene.remove(enemy);
        enemies.splice(index, 1);
        score++;
        document.getElementById('score').textContent = score;
        spawnDynamicMonster();
      }
    }
  });

  effect.render(scene, camera);
}

init();
</script>
</body>
</html>
