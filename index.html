<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Corte JJ VR — Perfect Alignment</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #87ceeb; height: 100%; width: 100%; font-family: sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #startOverlay {
    position: fixed; inset: 0; z-index: 99; background: #1b2e22; color: #ffffff;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; text-align: center; padding: 20px;
  }
  #startOverlay h1 { color: #44ff88; font-size: 26px; margin: 0; }
  #vrBtn {
    font-size: 18px; padding: 18px 36px; background: #44ff88; color: #0a1c10; border: none;
    border-radius: 30px; font-weight: bold; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 15px rgba(68,255,136,0.4);
  }
  #hud {
    position: fixed; top: 16px; left: 16px; z-index: 10; background: rgba(0, 0, 0, 0.6);
    color: #44ff88; padding: 8px 16px; border-radius: 20px; font-size: 14px; display: none; font-weight: bold;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/effects/StereoEffect.js"></script>
</head>
<body>

<div id="startOverlay">
  <h1>⚔️ CORTE JJ VR — DÍA Y ALINEACIÓN</h1>
  <p>1. Coloca el celular en HORIZONTAL.<br>2. Pon la cabeza recta mirando al frente.<br>3. Oprime el botón.</p>
  <button id="vrBtn">ENTRAR AL MUNDO VR</button>
</div>

<div id="hud">👹 Monstruos: <span id="score">0</span> | ❤️ Vida: <span id="hp">100</span></div>

<script>
let camera, scene, renderer, effect;
let isVR = false, score = 0, playerHp = 100;
const enemies = [];
let leftHand, rightHand, weapon, playerBody;
let isAttacking = false, attackTime = 0;
let globalTime = 0;

// Sistema de Calibración de Giroscopio por Cuaterniones
const currentOrientation = new THREE.Quaternion();
const baseOrientation = new THREE.Quaternion();
const finalOrientation = new THREE.Quaternion();
let isCalibrated = false;

window.addEventListener('deviceorientation', (e) => {
  if (e.alpha === null) return;

  const alpha = THREE.MathUtils.degToRad(e.alpha || 0);
  const beta = THREE.MathUtils.degToRad(e.beta || 0);
  const gamma = THREE.MathUtils.degToRad(e.gamma || 0);

  const euler = new THREE.Euler();

  // Detección de orientación Horizontal (Landscape Left / Right)
  if (window.orientation === 90) {
    euler.set(beta, -gamma, -alpha, 'YXZ');
  } else if (window.orientation === -90) {
    euler.set(-beta, gamma, -alpha, 'YXZ');
  } else {
    euler.set(gamma, alpha, -beta, 'YXZ');
  }

  currentOrientation.setFromEuler(euler);

  if (!isCalibrated) {
    baseOrientation.copy(currentOrientation).invert();
    isCalibrated = true;
  }
}, true);

function calibrateView() {
  baseOrientation.copy(currentOrientation).invert();
}

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87ceeb);
  scene.fog = new THREE.FogExp2(0xa0d8ef, 0.015);

  camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 150);
  camera.position.set(0, 1.6, 0);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  document.body.appendChild(renderer.domElement);

  effect = new THREE.StereoEffect(renderer);
  effect.eyeSeparation = 0.04;

  // Luces de día
  const sun = new THREE.DirectionalLight(0xffffff, 1.2);
  sun.position.set(20, 40, 20);
  scene.add(sun);

  const ambient = new THREE.AmbientLight(0x7799bb, 0.7);
  scene.add(ambient);

  buildWorld();
  createPlayerBody();
  createHandsAndWeapon();

  for(let i = 0; i < 4; i++) spawnMonster();

  window.addEventListener('touchstart', () => triggerAttack(), {passive: true});
  window.addEventListener('mousedown', () => triggerAttack());
  window.addEventListener('resize', updateLayout);
}

function updateLayout() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  effect.setSize(window.innerWidth, window.innerHeight);
}

function buildWorld() {
  // Suelo de pasto
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(200, 200),
    new THREE.MeshStandardMaterial({ color: 0x3b7a26, roughness: 0.9 })
  );
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  // Arboles Low-Poly
  for(let i = 0; i < 30; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = 15 + Math.random() * 40;
    createTree(Math.cos(angle)*dist, Math.sin(angle)*dist);
  }

  // Casas Explorables
  createHouse(-10, -15);
  createHouse(10, -18);
}

function createTree(x, z) {
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.2, 0.3, 3),
    new THREE.MeshStandardMaterial({ color: 0x4a2e18 })
  );
  trunk.position.set(x, 1.5, z);

  const leaves = new THREE.Mesh(
    new THREE.ConeGeometry(1.5, 3, 5),
    new THREE.MeshStandardMaterial({ color: 0x1d6610 })
  );
  leaves.position.set(x, 4, z);

  scene.add(trunk, leaves);
}

function createHouse(x, z) {
  const house = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: 0xd9c5b2 });

  const bWall = new THREE.Mesh(new THREE.BoxGeometry(6, 3.5, 0.2), mat);
  bWall.position.set(0, 1.75, -3);

  const lWall = new THREE.Mesh(new THREE.BoxGeometry(0.2, 3.5, 6), mat);
  lWall.position.set(-3, 1.75, 0);

  const rWall = new THREE.Mesh(new THREE.BoxGeometry(0.2, 3.5, 6), mat);
  rWall.position.set(3, 1.75, 0);

  const roof = new THREE.Mesh(
    new THREE.ConeGeometry(5, 2.5, 4),
    new THREE.MeshStandardMaterial({ color: 0x8b0000 })
  );
  roof.position.set(0, 4.75, 0);
  roof.rotation.y = Math.PI / 4;

  house.add(bWall, lWall, rWall, roof);
  house.position.set(x, 0, z);
  scene.add(house);
}

function createPlayerBody() {
  playerBody = new THREE.Group();
  const torso = new THREE.Mesh(
    new THREE.BoxGeometry(0.4, 0.6, 0.2),
    new THREE.MeshStandardMaterial({ color: 0x1a365d })
  );
  torso.position.set(0, -0.6, -0.1);

  const leftLeg = new THREE.Mesh(
    new THREE.BoxGeometry(0.15, 0.6, 0.15),
    new THREE.MeshStandardMaterial({ color: 0x0f172a })
  );
  leftLeg.position.set(-0.12, -1.2, -0.1);

  const rightLeg = leftLeg.clone();
  rightLeg.position.x = 0.12;

  playerBody.add(torso, leftLeg, rightLeg);
  camera.add(playerBody);
}

function createHandsAndWeapon() {
  const handMat = new THREE.MeshStandardMaterial({ color: 0xddb892 });
  leftHand = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.2), handMat);
  leftHand.position.set(-0.25, -0.25, -0.4);

  rightHand = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.2), handMat);
  rightHand.position.set(0.25, -0.25, -0.4);

  const blade = new THREE.Mesh(
    new THREE.BoxGeometry(0.03, 0.7, 0.03),
    new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8, roughness: 0.2 })
  );
  blade.position.set(0, 0.25, -0.05);
  blade.rotation.x = -Math.PI / 5;
  rightHand.add(blade);

  camera.add(leftHand, rightHand);
  scene.add(camera);
}

function spawnMonster() {
  const m = new THREE.Mesh(
    new THREE.DodecahedronGeometry(0.5),
    new THREE.MeshStandardMaterial({ color: 0xcc2222 })
  );
  const angle = Math.random() * Math.PI * 2;
  const dist = 12 + Math.random() * 10;
  m.position.set(Math.cos(angle)*dist, 1, Math.sin(angle)*dist);
  m.userData = { hp: 3 };
  scene.add(m);
  enemies.push(m);
}

document.getElementById('vrBtn').addEventListener('click', () => {
  calibrateView();
  isVR = true;
  document.getElementById('startOverlay').style.display = 'none';
  document.getElementById('hud').style.display = 'block';

  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen().catch(()=>{});

  setTimeout(() => updateLayout(), 300);
  animate();
});

function triggerAttack() {
  if (!isAttacking) {
    isAttacking = true;
    attackTime = 0;
  }
}

function updateGamepadInput() {
  const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (let gp of gamepads) {
    if (!gp) continue;

    const moveX = gp.axes[0] || 0;
    const moveZ = gp.axes[1] || 0;

    if (Math.abs(moveX) > 0.2 || Math.abs(moveZ) > 0.2) {
      const moveDir = new THREE.Vector3(moveX, 0, moveZ);
      moveDir.applyQuaternion(camera.quaternion);
      moveDir.y = 0;
      moveDir.normalize();
      camera.position.addScaledVector(moveDir, 0.07);
    }

    if (gp.buttons.some(b => b.pressed)) {
      triggerAttack();
    }
  }
}

function animate() {
  requestAnimationFrame(animate);
  if (!isVR) return;

  globalTime += 0.04;

  // Calibración Aplicada
  finalOrientation.multiplyQuaternions(baseOrientation, currentOrientation);
  camera.quaternion.slerp(finalOrientation, 0.2); // Suavizado de movimiento de cabeza

  updateGamepadInput();

  if (isAttacking) {
    attackTime += 0.25;
    rightHand.position.z = -0.4 - Math.sin(attackTime) * 0.2;
    if (attackTime >= Math.PI) {
      isAttacking = false;
      rightHand.position.set(0.25, -0.25, -0.4);
    }
  }

  enemies.forEach((enemy, index) => {
    enemy.position.y = 1 + Math.sin(globalTime + index) * 0.15;
    const dist = enemy.position.distanceTo(camera.position);

    if (dist > 1.2) {
      const dir = new THREE.Vector3().subVectors(camera.position, enemy.position).normalize();
      enemy.position.x += dir.x * 0.02;
      enemy.position.z += dir.z * 0.02;
    } else {
      playerHp -= 0.1;
      document.getElementById('hp').textContent = Math.max(0, Math.floor(playerHp));
    }
  });

  effect.render(scene, camera);
}

init();
</script>
</body>
</html>
