<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Corte JJ VR — VR Box</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; height: 100%; font-family: sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #startOverlay {
    position: fixed; inset: 0; z-index: 99; background: #04140a; color: #eafff0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 20px;
  }
  #startOverlay h1 { color: #00ff44; font-size: 24px; margin: 0; }
  #vrBtn {
    font-size: 20px; padding: 16px 36px; background: #00ff44; color: #04140a; border: none;
    border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase;
  }
  #hud {
    position: fixed; top: 10px; left: 10px; z-index: 10; background: rgba(0,0,0,0.7);
    color: #00ff44; padding: 8px 14px; border-radius: 6px; font-size: 14px; display: none;
  }
</style>
<!-- Librerías standard directamente desde CDNs de alta velocidad -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/effects/StereoEffect.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DeviceOrientationControls.js"></script>
</head>
<body>

<div id="startOverlay">
  <h1>⛏ CORTE JJ — VR BOX</h1>
  <p>Toca el botón para iniciar el giroscopio y dividir pantalla.</p>
  <button id="vrBtn">ENTRAR EN VR</button>
</div>

<div id="hud">Esmeraldas: <span id="gems">0</span></div>

<script>
let camera, scene, renderer, effect, controls;
let isVR = false, emeralds = 0;
const gemRocks = [], flyingGems = [];
let actionHeld = false;

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x8fd0ff);
  scene.fog = new THREE.FogExp2(0x8fd0ff, 0.02);

  camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 1.6, 5);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  document.body.appendChild(renderer.domElement);

  effect = new THREE.StereoEffect(renderer);
  effect.setSize(window.innerWidth, window.innerHeight);

  controls = new THREE.DeviceOrientationControls(camera);

  // Luces
  const light = new THREE.HemisphereLight(0xffffff, 0x448833, 1);
  scene.add(light);
  const sun = new THREE.DirectionalLight(0xffffff, 0.8);
  sun.position.set(5, 10, 5);
  scene.add(sun);

  // Suelo
  const groundGeo = new THREE.PlaneGeometry(50, 50);
  const groundMat = new THREE.MeshLambertMaterial({ color: 0x3a9e25 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  // Casa y árboles
  createBox(-5, 1.5, -4, 4, 3, 4, 0xe8dfc8); // Casa
  createBox(-5, 3.8, -4, 4.6, 1.6, 4.6, 0x1a3a7a); // Techo
  createTree(3, -5); createTree(-8, 2); createTree(4, 4);

  // Generar rocas de esmeralda
  const spots = [[2,-2],[-3,-3],[4,1],[-4,3],[1,4],[-2,5],[6,-3],[-6,-2]];
  spots.forEach(sp => spawnRock(sp[0], sp[1]));

  // Eventos de interacción (Touch y Control Bluetooth)
  window.addEventListener('touchstart', () => actionHeld = true);
  window.addEventListener('touchend', () => actionHeld = false);
  window.addEventListener('mousedown', () => actionHeld = true);
  window.addEventListener('mouseup', () => actionHeld = false);
  window.addEventListener('resize', onWindowResize);
}

function createBox(x, y, z, w, h, d, color) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color }));
  mesh.position.set(x, y, z);
  scene.add(mesh);
}

function createTree(x, z) {
  createBox(x, 1.5, z, 0.4, 3, 0.4, 0x8B5A2B);
  createBox(x, 3.3, z, 2, 2, 2, 0x2d8a1a);
}

function spawnRock(x, z) {
  const rock = new THREE.Mesh(
    new THREE.BoxGeometry(0.8, 0.8, 0.8),
    new THREE.MeshLambertMaterial({ color: 0x00ff44 })
  );
  rock.position.set(x, 0.4, z);
  rock.userData = { hp: 0 };
  scene.add(rock);
  gemRocks.push(rock);
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  effect.setSize(window.innerWidth, window.innerHeight);
}

document.getElementById('vrBtn').addEventListener('click', () => {
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(res => {
      if (res === 'granted') startVR();
    }).catch(() => startVR());
  } else {
    startVR();
  }
});

function startVR() {
  isVR = true;
  document.getElementById('startOverlay').style.display = 'none';
  document.getElementById('hud').style.display = 'block';
  if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen().catch(() => {});
  }
  animate();
}

const raycaster = new THREE.Raycaster();
const dir = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);

  if (!isVR) return;

  controls.update();

  // Movimiento al mantener presionado
  if (actionHeld) {
    camera.getWorldDirection(dir);
    dir.y = 0;
    dir.normalize();
    camera.position.addScaledVector(dir, 0.05);
  }

  // Minado al mirar rocas
  raycaster.set(camera.position, camera.getWorldDirection(dir));
  const hits = raycaster.intersectObjects(gemRocks);
  if (hits.length > 0 && actionHeld) {
    const target = hits[0].object;
    target.userData.hp += 0.02;
    target.scale.setScalar(1 - target.userData.hp * 0.3);
    if (target.userData.hp >= 1) {
      scene.remove(target);
      gemRocks.splice(gemRocks.indexOf(target), 1);
      emeralds++;
      document.getElementById('gems').textContent = emeralds;
    }
  }

  effect.render(scene, camera);
}

init();
</script>
</body>
</html>
